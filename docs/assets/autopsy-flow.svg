<text x="40" y="44" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf7" text-anchor="start" >Memory autopsy, temporal replay and counterfactuals</text>
<text x="40" y="66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8fa3c4" text-anchor="start" >An answer is explained by rebuilding it from records available at the cutoff, then verified against the live run.</text>
