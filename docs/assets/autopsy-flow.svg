<text x="660" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#fbbf24" text-anchor="start" >after_cutoff: recorded, never seen by the decision</text>
<rect x="60" y="250" width="240" height="60" rx="8" fill="#111a2e" stroke="#5eead4" stroke-width="1.6"/><text x="180.0" y="277.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf7" text-anchor="middle" >Replay</text><text x="180.0" y="296.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8fa3c4" text-anchor="middle" >EventLedger.copy() at cutoff</text>
<rect x="340" y="250" width="240" height="60" rx="8" fill="#111a2e" stroke="#5eead4" stroke-width="1.6"/><text x="460.0" y="277.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf7" text-anchor="middle" >Rebuild &amp; verify</text><text x="460.0" y="296.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8fa3c4" text-anchor="middle" >autopsy digest == stored</text>
<rect x="680" y="250" width="250" height="60" rx="8" fill="#111a2e" stroke="#2a3a5c" stroke-width="1.2"/><text x="805.0" y="277.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf7" text-anchor="middle" >Counterfactual</text><text x="805.0" y="296.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8fa3c4" text-anchor="middle" >alternative config, evidence fixed</text>
<rect x="970" y="250" width="250" height="60" rx="8" fill="#111a2e" stroke="#2a3a5c" stroke-width="1.2"/><text x="1095.0" y="277.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf7" text-anchor="middle" >Re-simulation</text><text x="1095.0" y="296.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8fa3c4" text-anchor="middle" >feedback loop differs: reported</text>
<line x1="300" y1="280" x2="338" y2="280" stroke="#8fa3c4" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="930" y1="280" x2="968" y2="280" stroke="#8fa3c4" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="40" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="start" >Missing provenance is reported as missing, never filled in. Counterfactuals on fixed evidence are decision-level recomputations, not causal estimates.</text>
<text x="40" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#8fa3c4" text-anchor="start" >Hidden ground truth appears only in `analysis`, outside the chain, so the explanation cannot be circular.</text>
</svg>
