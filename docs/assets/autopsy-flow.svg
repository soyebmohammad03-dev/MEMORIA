<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
<title id="t">Autopsy, replay and counterfactual flow</title><desc id="d">Evidence chain of an answer at a cutoff, with replay, verification by rebuild and counterfactual analysis.</desc>
