<text x="40" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5eead4" text-anchor="start" >evidence chain at the cutoff  (each link: found · missing · not applicable)</text>
